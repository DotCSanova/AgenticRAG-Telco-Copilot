[project]
name = "RAG-Agent"
version = "0.1.0"
description = "A Agentic-RAG Chatbot for technical documents"
readme = "README.md"
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  "pydantic",
  "pydantic-settings",
  "qdrant-client>=1.14.0",
  "cohere>=7.0.8",
  "fastembed>=0.8.0",
]
requires-python = ">= 3.10"

[dependency-groups]
dev = [
    "coverage",
    "pre-commit",
    "pytest",
    "ruff",
]
serving = [
  "fastapi[standard]",
  "google-adk>=1.0.0",
  "litellm>=1.0.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "greenlet>=3.0",
]
ingest = [
  "pymupdf>=1.27.2.3",
  "docling>=2.93.0",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "sentence-transformers>=5.6.1",
]
notebooks = [
  "ipykernel",
]

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
# Local DX (3c): chat/tests by default; add `--group ingest` for host-side indexing.
default-groups = ["serving", "dev"]

[tool.uv.sources]
# Host GPU (Windows/Linux). Docker ingest overrides with UV_TORCH_BACKEND=cpu.
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
