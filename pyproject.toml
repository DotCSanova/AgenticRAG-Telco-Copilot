[project]
name = "RAG-Agent"
version = "0.1.0"
description = "A Agentic-RAG Chatbot for technical documents"
readme = "README.md"
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  "pydantic",
  "pydantic-settings",
  "qdrant-client>=1.14.0",
  "cohere>=7.0.8",
  "fastembed>=0.8.0",
]
requires-python = ">= 3.10"

[dependency-groups]
dev = [
    "coverage",
    "pre-commit",
    "pytest",
    "ruff",
]
serving = [
  "fastapi[standard]",
  "google-adk>=1.0.0",
  "litellm>=1.0.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "greenlet>=3.0",
]
ingest = [
  "pymupdf>=1.27.2.3",
  "docling>=2.93.0",
  # Docling pulls opencv-python; headless avoids X11/GL in Docker.
  # Pin 4.x: 5.x on Windows can install a cv2 namespace without setNumThreads.
  "opencv-python-headless>=4.8.0,<5",
  "sentence-transformers>=5.6.1",
  "fastapi[standard]",
  "google-cloud-storage>=2.18.0",
  "google-cloud-secret-manager>=2.20.0",
]
notebooks = [
  "ipykernel",
]

# Mutually exclusive torch builds. Docker / Cloud Run: --extra cpu.
# Host GPU: --extra cu124. Always pass one with --group ingest.
[project.optional-dependencies]
cpu = [
  "torch>=2.5.1,<2.7",
  "torchvision>=0.20.1,<0.22",
]
cu124 = [
  "torch>=2.5.1,<2.7",
  "torchvision>=0.20.1,<0.22",
]

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.pytest.ini_options]
markers = [
    "integration: tests that run Docling convert (not part of default fast CI)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
# Local DX (3c): chat/tests by default; add `--group ingest --extra cpu|cu124`.
default-groups = ["serving", "dev"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]
# Docling depends on opencv-python; we ship opencv-python-headless instead (no libxcb/libGL).
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
