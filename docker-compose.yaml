services:
  postgres:
    image: postgres:16-alpine
    container_name: RAG-Agent-postgres
    # Local-only credentials. Do NOT reuse Cloud SQL DB_USER/DB_PASS from .env —
    # those are for Cloud Run; mixing them breaks auth against this container.
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sessions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sessions"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - RAG-Agent-network

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: RAG-Agent-qdrant
    ports:
      - "6333:6333"
    networks:
      - RAG-Agent-network

  agent-api:
    container_name: RAG-Agent-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host 8000 → container 8080 (Dockerfile / Cloud Run default)
      - "8000:8080"
    env_file:
      - .env
    environment:
      # Override hostnames for the Docker network (env_file may say localhost).
      # Local postgres is always app:app (see postgres service). Cloud SQL
      # DB_USER/DB_PASS in .env must not be interpolated here.
      SESSIONS_DB_URL: postgresql+asyncpg://app:app@postgres:5432/sessions
      QDRANT_URL: http://qdrant:6333
      # No QDRANT_API_KEY → local unauthenticated Qdrant
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - RAG-Agent-network

  # ADK Dev UI (pruebas del agente). No es la API de producto.
  agent-dev-ui:
    container_name: RAG-Agent-dev-ui
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "/app/.venv/bin/uvicorn",
        "RAG_Agent.infrastructure.agent.dev_ui:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SESSIONS_DB_URL: postgresql+asyncpg://app:app@postgres:5432/sessions
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    profiles:
      - dev
    networks:
      - RAG-Agent-network

networks:
  RAG-Agent-network:
    name: RAG-Agent-network
