services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-app}
      - POSTGRES_PASSWORD=${DB_PASS:-password}
      - POSTGRES_DB=sessions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d sessions"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-api:
    container_name: RAG-Agent-api
    build:
      context: .
      dockerfile: Dockerfile.serving
    ports:
      - "8000:8080"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - SESSIONS_DB_URL=postgresql+asyncpg://${DB_USER:-app}:${DB_PASS:-password}@db:5432/sessions
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=""
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-tech_docs}
      - AGENT_MODEL=${AGENT_MODEL:-cohere_chat/command-a-03-2025}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ADK Dev UI. Same serving image, different CMD.
  agent-dev-ui:
    container_name: RAG-Agent-dev-ui
    build:
      context: .
      dockerfile: Dockerfile.serving
    command:
      [
        "uvicorn",
        "RAG_Agent.infrastructure.agent.dev_ui:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    ports:
      - "8080:8080"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - SESSIONS_DB_URL=postgresql+asyncpg://${DB_USER:-app}:${DB_PASS:-password}@db:5432/sessions
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=""
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-tech_docs}
      - AGENT_MODEL=${AGENT_MODEL:-cohere_chat/command-a-03-2025}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    profiles:
      - dev

  # Local ingest test: override CMD with ingest_local.py. Always hits compose Qdrant
  # (never QDRANT_URL from .env). Production ingest is Cloud Run, not this service.
  agent-ingest:
    container_name: RAG-Agent-ingest
    build:
      context: .
      dockerfile: Dockerfile.ingest
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=""
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-tech_docs}
      - CHUNKER=${CHUNKER:-section}
    volumes:
      - ./data:/data:ro
      # Laptop CLI only; Cloud Run uses main_ingest.py and does not ship scripts/.
      - ./scripts:/app/scripts:ro
    depends_on:
      qdrant:
        condition: service_started
    profiles:
      - ingest
